name: Generate Print-Ready Booklet PDF

on:
  push:
    paths:
      - 'bulletins/*.pdf'
    branches:
      - main

# Grant write permissions to commit files back to the repository
permissions:
  contents: write

jobs:
  build-booklet:
    # Avoid infinite trigger loops from bot commits
    if: "!contains(github.event.head_commit.message, 'Automated Booklet Generation')"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install PDF Processing Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pypdf

      - name: Convert Bulletin to Booklet
        run: |
          python .github/scripts/convert_to_booklet.py

      - name: Commit and Push Booklet to booklet/ Folder
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add booklet/*.pdf
          
          # Only commit and push if files were actually changed/added
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Automated Booklet Generation [skip ci]"
            git push
          fi
