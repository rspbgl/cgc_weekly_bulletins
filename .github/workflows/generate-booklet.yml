name: Generate Print-Ready Booklet PDF & Update Web Page

on:
  push:
    paths:
      - 'bulletins/*.pdf'
    branches:
      - main

permissions:
  contents: write

jobs:
  build-booklet:
    if: "!contains(github.event.head_commit.message, 'Automated Booklet Generation')"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install PDF Processing Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pypdf

      - name: Convert Bulletin to Booklet
        run: |
          python .github/scripts/convert_to_booklet.py

      - name: Update Latest Bulletin Manifest
        run: |
          python - <<'PY'
          import json
          import os
          import sys

          with open(os.environ["GITHUB_EVENT_PATH"], encoding="utf-8") as event_file:
              event = json.load(event_file)

          changed_pdfs = []
          for commit in event.get("commits", []):
              for key in ("added", "modified"):
                  for file_path in commit.get(key, []):
                      if file_path.startswith("bulletins/") and file_path.lower().endswith(".pdf"):
                          changed_pdfs.append(file_path)

          if not changed_pdfs:
              sys.exit("No bulletin PDF found in this push.")

          latest_pdf = changed_pdfs[-1]
          print(f"Latest PDF found: {latest_pdf}")
          with open("latest-bulletin.json", "w", encoding="utf-8") as manifest:
              json.dump({"path": latest_pdf}, manifest, indent=2)
              manifest.write("\n")
          PY

      - name: Commit and Push Changes
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add booklet/*.pdf latest-bulletin.json
          
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Automated Booklet Generation & Site Update [skip ci]"
            git push
          fi
