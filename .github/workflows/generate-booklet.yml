name: Generate Print-Ready Booklet PDF & Update Web Page

on:
  workflow_dispatch:
  push:
    paths:
      - 'bulletins/*.pdf'
    branches:
      - main

permissions:
  contents: write

jobs:
  build-booklet:
    if: "!contains(github.event.head_commit.message, 'Automated Booklet Generation')"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install PDF Processing Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pypdf

      - name: Convert Bulletin to Booklet
        run: |
          python .github/scripts/convert_to_booklet.py

      - name: Update Latest Bulletin Manifest
        run: |
          LATEST_PDF=$(git show --name-only --pretty=format: "$GITHUB_SHA" -- 'bulletins/*.pdf' | grep -E '^bulletins/.*\.pdf$' | tail -n 1)
          if [ -z "$LATEST_PDF" ]; then
            LATEST_PDF=$(find bulletins -maxdepth 1 -name '*.pdf' -printf '%T@ %p\n' | sort -nr | head -n 1 | cut -d' ' -f2-)
          fi
          if [ -z "$LATEST_PDF" ]; then
            echo "No bulletin PDF found."
            exit 1
          fi
          export LATEST_PDF
          echo "Latest PDF found: $LATEST_PDF"
          python -c "import json, os; open('latest-bulletin.json', 'w', encoding='utf-8').write(json.dumps({'path': os.environ['LATEST_PDF']}, indent=2) + '\n')"

      - name: Commit and Push Changes
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add booklet/*.pdf latest-bulletin.json
          
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Automated Booklet Generation & Site Update [skip ci]"
            git push
          fi
