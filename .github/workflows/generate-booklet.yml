name: Generate Print-Ready Booklet PDF & Update Web Page

on:
  push:
    paths:
      - 'bulletins/*.pdf'
    branches:
      - main

permissions:
  contents: write

jobs:
  build-booklet:
    if: "!contains(github.event.head_commit.message, 'Automated Booklet Generation')"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install PDF Processing Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pypdf

      - name: Convert Bulletin to Booklet
        run: |
          python .github/scripts/convert_to_booklet.py

      - name: Update index.html with Latest Bulletin Path
        run: |
          LATEST_PDF=$(ls -1t bulletins/*.pdf | head -n 1)
          echo "Latest PDF found: $LATEST_PDF"
          sed -i "s|bulletins/LATEST_BULLETIN.pdf|${LATEST_PDF}|g" index.html

      - name: Commit and Push Changes
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add booklet/*.pdf index.html
          
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Automated Booklet Generation & Site Update [skip ci]"
            git push
          fi
