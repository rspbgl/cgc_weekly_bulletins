<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Latest Church Bulletin</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; font-family: sans-serif; }
    iframe { width: 100%; height: 100%; border: none; }
    .fallback { padding: 2rem; text-align: center; }
  </style>
</head>
<body>

  <iframe id="pdf-viewer" src="" title="Church Bulletin PDF"></iframe>

  <script>
    const repoOwner = 'rspbgl';
    const repoName = 'cgc_weekly_bulletins';
    const folderPath = 'bulletins';

    // Helper: Converts filenames like "Bulletin_6th_Sept_2026.pdf" into a timestamp
    function parseBulletinDate(filename) {
      try {
        // Extract date components: day, month abbreviation, year
        // Matches patterns like: 6th_Sept_2026, 30th August 2026, 1st_Jan_2026
        const cleanName = filename.replace(/_/g, ' ');
        const match = cleanName.match(/(\d{1,2})(?:st|nd|rd|th)?\s+([A-Za-z]+)\s+(\d{4})/);

        if (!match) return 0;

        const day = match[1];
        const monthStr = match[2];
        const year = match[3];

        const dateObj = new Date(`${monthStr} ${day}, ${year}`);
        return dateObj.getTime() || 0;
      } catch (e) {
        return 0;
      }
    }

    async function loadLatestPdf() {
      try {
        const response = await fetch(`https://api.github.com/repos/${repoOwner}/${repoName}/contents/${folderPath}`);
        const files = await response.json();

        const pdfFiles = files.filter(file => file.name.endsWith('.pdf'));

        if (pdfFiles.length === 0) {
          document.body.innerHTML = '<div class="fallback"><h2>No bulletins found.</h2></div>';
          return;
        }

        // Sort by parsed timestamp in ascending order (newest date will be last element)
        pdfFiles.sort((a, b) => parseBulletinDate(a.name) - parseBulletinDate(b.name));

        const latestPdf = pdfFiles[pdfFiles.length - 1];
        document.getElementById('pdf-viewer').src = latestPdf.path;

      } catch (error) {
        console.error('Error fetching latest PDF:', error);
        document.body.innerHTML = '<div class="fallback"><h2>Unable to load the latest bulletin.</h2></div>';
      }
    }

    loadLatestPdf();
  </script>
</body>
</html>
